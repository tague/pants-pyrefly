name: Pyrefly compatibility

# Runs build-support/ci/compat_test.sh in two matrices and one extra job:
#   - `compat`: every supported Pyrefly version (pinned minus denylisted, from subsystems.py) on
#     this repo's Pants;
#   - `compat-pants`: the default Pyrefly version on every supported Pants minor (latest stable
#     patch of each);
#   - `compat-python39`: the default Pyrefly version on this repo's Pants, checking a project
#     constrained to `CPython==3.9.*`.
# It gates releases: release.yml calls this workflow and the PyPI publish job needs it, so every
# job must pass. It also runs on demand. Deliberately not run on pull requests or on a
# schedule.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  versions:
    name: list supported Pyrefly versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
      default: ${{ steps.list.outputs.default }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        name: Read the supported and default versions from subsystems.py
        run: |
          versions="$(python3 build-support/bin/generate_known_versions.py --list-versions)"
          default="$(python3 build-support/bin/generate_known_versions.py --default-version)"
          echo "Supported Pyrefly versions: ${versions}"
          echo "Default Pyrefly version: ${default}"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"
          echo "default=${default}" >> "$GITHUB_OUTPUT"

  compat:
    name: compat (Pyrefly ${{ matrix.pyrefly-version }})
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyrefly-version: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7

      # The compat project runs under this repo's Pants (2.33, CPython 3.14) and type-checks a
      # sample project with interpreter constraints `>=3.11,<3.15`.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: pantsbuild/actions/init-pants@v11
        with:
          gha-cache-key: compat-v0
          named-caches-hash: ${{ hashFiles('build-support/lockfiles/*.lock') }}

      - name: Compatibility test
        run: bash build-support/ci/compat_test.sh "${{ matrix.pyrefly-version }}"

  compat-pants:
    name: compat (Pants ${{ matrix.pants-version }}, Pyrefly ${{ needs.versions.outputs.default }})
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest stable patch of every supported Pants minor (2.27-2.33).
        pants-version: ["2.27.1", "2.28.1", "2.29.1", "2.30.2", "2.31.0", "2.32.1", "2.33.1"]
    steps:
      - uses: actions/checkout@v7

      # Pants brings its own interpreter (CPython 3.11 through 2.31, 3.14 from 2.32). The compat
      # project's interpreter constraints are `>=3.11,<3.15`; install both ends of that range plus
      # 3.12, as the smoke matrix in ci.yml does.
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.11
            3.12
            3.14

      - uses: pantsbuild/actions/init-pants@v11
        with:
          gha-cache-key: compat-pants-${{ matrix.pants-version }}-v0
          named-caches-hash: ${{ hashFiles('build-support/lockfiles/*.lock') }}

      - name: Compatibility test
        env:
          PANTS_VERSION: ${{ matrix.pants-version }}
        run: bash build-support/ci/compat_test.sh "${{ needs.versions.outputs.default }}"

  compat-python39:
    name: compat (Python 3.9 project, Pyrefly ${{ needs.versions.outputs.default }})
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The plugin passes `--python-version` from the minimum of the project's interpreter
      # constraints, and builds the venv behind `--python-interpreter-path` with an interpreter
      # that satisfies them, so a `CPython==3.9.*` project needs a real Python 3.9. Pants itself
      # runs on its own bundled interpreter.
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.9
            3.14

      - uses: pantsbuild/actions/init-pants@v11
        with:
          gha-cache-key: compat-python39-v0
          named-caches-hash: ${{ hashFiles('build-support/lockfiles/*.lock') }}

      # Besides the usual steps, the script asserts every Pyrefly process got
      # `--python-version=3.9` and a 3.9-or-newer interpreter, and that a `match` statement
      # (Python 3.10+) is rejected with `invalid-syntax`.
      - name: Compatibility test (Python 3.9 project)
        env:
          COMPAT_INTERPRETER_CONSTRAINTS: "CPython==3.9.*"
          COMPAT_PYTHON_VERSION: "3.9"
        run: bash build-support/ci/compat_test.sh "${{ needs.versions.outputs.default }}"
