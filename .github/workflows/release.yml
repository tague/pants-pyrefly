name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # The compatibility suite must pass before anything is published: every supported Pyrefly version
  # on this repo's Pants, and the default Pyrefly on every supported Pants minor. `publish` needs
  # this job, which succeeds only when every job in the called workflow (both matrices) succeeds.
  compat:
    name: Pyrefly compatibility
    uses: ./.github/workflows/compat.yml
    permissions:
      contents: read

  publish:
    name: Build and publish to PyPI
    needs: compat
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # `actions/checkout` needs repo read. Naming any permission drops all the others to
      # `none`, so `contents: read` must be listed explicitly alongside the OIDC scope.
      contents: read
      # Required for PyPI Trusted Publishing (OIDC). No API token needed.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: pantsbuild/actions/init-pants@v11
        with:
          gha-cache-key: v0
          named-caches-hash: ${{ hashFiles('build-support/lockfiles/*.lock') }}

      - name: Build wheel + sdist
        run: pants package pants-plugins/pants_pyrefly:dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          packages-dir: dist/
          # Fail if the artifacts look wrong rather than silently skipping.
          verify-metadata: true
