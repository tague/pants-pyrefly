name: Upstream Pyrefly releases

# Weekly report of upstream Pyrefly releases the plugin has not caught up with. It runs only
# `generate_known_versions.py --check-upstream`, which fails when a stable release at or above
# MINIMUM_PINNED_VERSION is neither pinned nor denylisted (a newer release or a backport to an older
# line). It only reports: it never writes pins or opens a PR, and it does not run the compatibility
# suite (compat.yml), which runs on demand and before every release.
#
# A failed run is the notification. For scheduled runs GitHub notifies the user who last changed
# the cron line below, subject to their Actions notification settings. The job summary shows the
# generator's output as is. An `error:` line saying "neither pinned nor denylisted" is a real
# finding, followed by the commands to run. Any other failure, such as `GET ... failed after N
# attempts`, is usually a GitHub API or network problem; re-run.
#
# GitHub disables scheduled workflows in a public repository after 60 days without repository
# activity. If that happens, re-enable it from the repository's Actions tab.
on:
  schedule:
    # Mondays at 06:17 UTC. Off-peak, and off the top of the hour, when GitHub's scheduler is
    # busiest and scheduled runs are most often delayed or dropped.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    name: check for unpinned Pyrefly releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The generator is pure stdlib; no Pants needed.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check upstream Pyrefly releases
        # `shell: bash` runs with `-eo pipefail`, so `status` is the generator's exit status.
        shell: bash
        env:
          # Raises the GitHub API rate limit. The generator sends it only to api.github.com.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          log="${RUNNER_TEMP}/check-upstream.log"
          status=0
          python3 build-support/bin/generate_known_versions.py --check-upstream 2>&1 \
            | tee "$log" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Upstream Pyrefly check passed: nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Upstream Pyrefly check failed"
              echo
              echo '```'
              cat "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Upstream Pyrefly check failed; see the job summary for the output."
          fi
          exit "$status"
