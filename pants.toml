[GLOBAL]
pants_version = "2.33.2"
pythonpath = ["%(buildroot)s/pants-plugins"]
backend_packages = [
    "pants.backend.python",
    "pants.backend.plugin_development",
    "pants.backend.experimental.python",
    "pants.backend.experimental.python.lint.ruff.check",
    "pants.backend.experimental.python.lint.ruff.format",
    "pants_pyrefly",
]

[python]
enable_resolves = true
# Floor is 3.10: Pants 2.33's built-in pytest lockfile no longer supports CPython 3.9.
interpreter_constraints = [">=3.10,<3.15"]
default_resolve = "python-default"

[python.resolves]
pants-plugins = "build-support/lockfiles/pants-plugins.lock"
python-default = "build-support/lockfiles/python-default.lock"

[python.resolves_to_interpreter_constraints]
# The plugin imports `pantsbuild.pants`, which only runs on the interpreter Pants itself uses.
# Pants 2.33 ships as cp314, so the plugin resolve must target CPython 3.14.
pants-plugins = ["==3.14.*"]

[python-repos]
# `pantsbuild.pants` is not published to PyPI; it lives in the Pants wheels index.
indexes = [
    "https://pypi.org/simple/",
    "https://wheels.pantsbuild.org/simple/",
]

[source]
root_patterns = [
    "/pants-plugins",
    "/testprojects/src",
    "/build-support/bin",
]

[ruff]
# Pinned ahead of the Ruff that Pants bundles (0.14.14 in Pants 2.33). Setting `known_versions`
# replaces Pants' built-in list, so it must cover every platform for the pinned version. Bump by
# hand (Dependabot cannot): sizes and sha256 digests are on the release's
# `ruff-{aarch64,x86_64}-{unknown-linux-musl,apple-darwin}.tar.gz` assets.
version = "0.17.3"
known_versions = [
    "0.17.3|linux_arm64|650d5991fea0baf8a5ee17672a3b20c45ac238ac85fa09077d66ef0cec31cdcf|9574296",
    "0.17.3|linux_x86_64|85e76bbb60e708a22624b31efb227e8bdaa6978177b93c146d352de4caf37ba1|10407681",
    "0.17.3|macos_arm64|118f7121aa838785672bf612487f755a89108bb5f44e0f3df96c5967a72614f9|9356803",
    "0.17.3|macos_x86_64|17f95b1bee24d70de62ffe5beec7f71bb541c7e3d147a1c3d84f7cd6525f6fdf|10117731",
]
